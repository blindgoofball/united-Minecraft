plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
}

version = rootProject.mod_version
group = rootProject.maven_group

// Same arrangement as the Fabric module: the shared sources are compiled here, in this
// loader's own environment, rather than consumed as an artifact. See the root build.gradle.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Keeps the jar named after the mod rather than after this subproject's directory.
base {
	archivesName = rootProject.name
}

neoForge {
	version = rootProject.neoforge_version

	// Mixins are configured through neoforge.mods.toml; this is what puts the mod's own
	// classes on the dev-run classpath as a mod rather than as plain library code.
	mods {
		"united_minecraft" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	// ModDevGradle resolves an explicit toolchain for its own tooling and dev runs, and falls
	// back to NeoForge's usual Java 21 when the project declares none - which cannot work
	// here, since Minecraft 26.3 needs Java 25 and that is the only JDK this project targets.
	// Loom never needed this because it just uses the Gradle JVM.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Workaround, removable once a ModDevGradle release lists Minecraft 26.3.
//
// MDG 2.0.147 was published four days before 26.3 released, and its baked-in version table
// knows 26.3-snapshot-N but not plain 26.3. Unable to look the version up, it cannot work
// out which Java the game needs and falls back to NeoForge's usual 21 - which nothing here
// can satisfy, since 25 is the only JDK this project targets and the only one Minecraft
// 26.3 runs on. Compiling is unaffected (that uses the toolchain above); it is the tooling
// JVM and the dev-run JVM that have to be pointed at 25 by hand.
def java25 = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}

// The NeoForm Runtime tasks (downloadAssets, createMinecraftArtifacts and friends) take a
// plain executable path.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
	javaExecutable = java25.map { it.executablePath.asFile.absolutePath }
}

// The dev runs are JavaExec tasks; JavaExec's own javaLauncher is public API, so there is no
// need to name MDG's internal task type here.
tasks.withType(JavaExec).configureEach {
	javaLauncher = java25
}

tasks.named('check') {
	dependsOn rootProject.tasks.named('checkSharedSources')
}

jar {
	def modName = rootProject.name
	inputs.property "modName", modName

	// Every release targets exactly one Minecraft version and stops working after the next
	// one - baking it into the filename (not just the version number) keeps a jar
	// self-describing even with no other context. The loader suffix answers the other
	// question someone holding a lone jar has to be able to answer.
	archiveFileName = "${modName}-${project.version}+mc${rootProject.minecraft_version}-neoforge.jar"

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$modName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
