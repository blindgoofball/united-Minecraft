# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3

# Mod Properties
mod_version=1.7.0
maven_group=com.nibblenerds

# Loader modules
# Set to false while NeoForge has not yet caught up to a new Minecraft version - the build,
# CI and release then run Fabric-only. See settings.gradle.
neoforge_enabled=true
neoforge_version=26.3.0.99
moddev_version=2.0.148

# Dependencies
junit_version=5.14.4
fabric_api_version=0.165.0+26.3
