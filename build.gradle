// Nothing is built at the root. The shared sources under common/ are not an artifact - each
// loader module compiles them itself, in its own environment, with its own first-party
// Gradle plugin (see fabric/build.gradle). That is what lets the loader modules build
// completely independently of one another, which in turn is what makes a day-one Minecraft
// release possible while a loader is still catching up - see the note in settings.gradle.

/**
 * Shared code has to stay loader-agnostic, and the compiler alone won't enforce it: every
 * loader module compiles common/ with its own loader on the classpath, so a stray
 * net.fabricmc import in shared code would compile perfectly well in the Fabric module and
 * only surface as a failure once someone built the NeoForge one. Check for it directly.
 */
tasks.register('checkSharedSources') {
	description = 'Fails if shared sources under common/ import a mod loader API.'
	group = 'verification'

	def sharedSources = fileTree(rootProject.file('common/src/main/java')) {
		include '**/*.java'
	}
	inputs.files(sharedSources).withPropertyName('sharedSources')

	doLast {
		def offenders = []
		sharedSources.each { file ->
			file.eachLine('UTF-8') { line, number ->
				if (line ==~ /^\s*import\s+(net\.fabricmc|net\.neoforged|cpw\.mods)\..*/) {
					offenders << "${rootProject.relativePath(file)}:${number}  ${line.trim()}"
				}
			}
		}
		if (!offenders.isEmpty()) {
			throw new GradleException(
					"Shared sources must not import a mod loader API - move this behind the Platform/ClientHooks seam:\n  "
							+ offenders.join('\n  '))
		}
	}
}
